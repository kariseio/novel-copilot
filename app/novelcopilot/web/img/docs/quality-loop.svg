<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="ql-title ql-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="ql-title">품질을 지키는 구조</title>
  <desc id="ql-desc">생성은 Claude, 심사는 GPT로 교차 벤더 분리하고, 사실 가드(캐논)와 계측(참조선)이 곁에서 받친다. 최종 결정은 작가의 몫이며 자동 강제는 없다.</desc>
  <defs>
    <marker id="ql-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="19" font-weight="700" fill="#111317">품질을 지키는 구조</text>
  <text x="30" y="56" font-size="13" fill="#6B7280">정독이 1차 척도, 수치는 조향, 사실은 가드 — 최종 결정은 언제나 작가.</text>

  <!-- Main horizontal spine: 생성 → 본문 → 심사 -->
  <!-- 생성(Claude) -->
  <g>
    <rect x="40" y="150" width="160" height="86" rx="12" fill="#EFF4FF" stroke="#DBE5FB"/>
    <text x="120" y="184" font-size="15" font-weight="700" fill="#1B4AC2" text-anchor="middle">생성</text>
    <text x="120" y="208" font-size="12.5" fill="#3A3F46" text-anchor="middle">집필 모델</text>
    <text x="120" y="225" font-size="12.5" font-weight="700" fill="#1B4AC2" text-anchor="middle">Claude</text>
  </g>
  <line x1="200" y1="193" x2="238" y2="193" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ql-arrow)"/>

  <!-- 본문 -->
  <g>
    <rect x="244" y="150" width="150" height="86" rx="12" fill="#ffffff" stroke="#ECEEF1"/>
    <text x="319" y="188" font-size="15" font-weight="700" fill="#111317" text-anchor="middle">본문</text>
    <text x="319" y="212" font-size="12" fill="#3A3F46" text-anchor="middle">이번 회차 초안</text>
  </g>
  <line x1="394" y1="193" x2="432" y2="193" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ql-arrow)"/>

  <!-- 심사(GPT) -->
  <g>
    <rect x="438" y="150" width="170" height="86" rx="12" fill="#1E2A4A"/>
    <text x="523" y="178" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">심사</text>
    <text x="523" y="200" font-size="12.5" fill="#C9D2E6" text-anchor="middle">교차 벤더 정독</text>
    <text x="523" y="222" font-size="12.5" font-weight="700" fill="#AFC0E8" text-anchor="middle">GPT</text>
  </g>

  <!-- 자기 채점 금지 label above 심사 -->
  <g>
    <rect x="438" y="118" width="170" height="24" rx="12" fill="#FCEAE9" stroke="#C4231F" stroke-opacity="0.35"/>
    <text x="523" y="135" font-size="11.5" font-weight="700" fill="#C4231F" text-anchor="middle">자기 채점 금지</text>
  </g>

  <!-- flanking supports: 사실 가드 (below, into 본문) and 계측 (below, into 심사) -->
  <!-- 사실 가드 -->
  <g>
    <rect x="230" y="290" width="180" height="66" rx="12" fill="#EEF1F8" stroke="#DCDFE4"/>
    <text x="320" y="316" font-size="13.5" font-weight="700" fill="#1E2A4A" text-anchor="middle">사실 가드 (캐논)</text>
    <text x="320" y="338" font-size="11.5" fill="#3A3F46" text-anchor="middle">하드 위반 0 · 사실 불변</text>
  </g>
  <line x1="320" y1="290" x2="320" y2="240" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ql-arrow)"/>

  <!-- 계측 -->
  <g>
    <rect x="438" y="290" width="180" height="66" rx="12" fill="#F6F7F9" stroke="#ECEEF1"/>
    <text x="528" y="316" font-size="13.5" font-weight="700" fill="#3A3F46" text-anchor="middle">계측 (참조선)</text>
    <text x="528" y="338" font-size="11.5" fill="#6B7280" text-anchor="middle">문말 지배율 · 인간 대역</text>
  </g>
  <line x1="528" y1="290" x2="528" y2="240" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ql-arrow)"/>

  <text x="424" y="278" font-size="11" fill="#6B7280" text-anchor="middle">곁에서 받침 (advisory)</text>

  <!-- 심사 → 작가 -->
  <line x1="608" y1="193" x2="662" y2="193" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ql-arrow)"/>

  <!-- 작가 최종 결정 -->
  <g>
    <rect x="668" y="142" width="212" height="102" rx="14" fill="#E6F4EC" stroke="#0F7A4B" stroke-opacity="0.4"/>
    <text x="774" y="176" font-size="15.5" font-weight="700" fill="#0F7A4B" text-anchor="middle">최종 결정 = 작가</text>
    <text x="774" y="202" font-size="12" fill="#3A3F46" text-anchor="middle">시스템은 측정·제안만</text>
    <text x="774" y="222" font-size="12" fill="#3A3F46" text-anchor="middle">자동 재작성·차단 없음</text>
    <text x="774" y="240" font-size="11.5" font-weight="700" fill="#0F7A4B" text-anchor="middle">무강제</text>
  </g>

  <text x="890" y="388" font-size="11.5" fill="#6B7280" text-anchor="end">출처: 작동 방식 §4</text>
</svg>
